# 服务端口
server:
  port: 8080
# 数据库配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/club_manager?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root # 改成你的mysql账号
    password: 123456789 # 改成你的mysql密码
# MyBatisPlus配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.club.clubsystem.domain
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL日志